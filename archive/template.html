<style>
  :root{
    --ink:#1a2f4a;
    --sky:#a8c5d6;
    --gold:#c9a961;
    --gold-soft:#d9bd82;
    --paper:#faf7f2;
    --paper-warm:#f3ece0;
    --ink-soft: #2d4664;
    --muted: rgba(26,47,74,.55);
    --hairline: rgba(26,47,74,.18);
    --serif: 'Cormorant Garamond', 'Times New Roman', serif;
    --display: 'Italiana', 'Cormorant Garamond', serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img{max-width:100%;display:block}
  a{color:inherit}
  button{font-family:inherit}

  /* utility */
  .label {
    font-family: var(--sans);
    font-size: 10.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }
  .gold { color: var(--gold); }
  .italic { font-style: italic; }
  .script { font-family: var(--display); letter-spacing: .01em; }

  /* hairline divider with diamond */
  .divider{
    display:flex; align-items:center; justify-content:center; gap:14px;
    color: var(--gold);
  }
  .divider::before, .divider::after{
    content:''; flex:1; max-width: 140px; height:1px;
    background: linear-gradient(to right, transparent, var(--gold-soft), transparent);
  }
  .divider .dot{
    width:6px; height:6px; transform: rotate(45deg);
    border:1px solid var(--gold); background: transparent;
  }

  /* --- Pétalos / partículas doradas --- */
  .petals{
    position: fixed; inset:0; pointer-events:none; z-index: 2; overflow:hidden;
  }
  .petals .p{
    position:absolute; top:-20px;
    width:8px; height:8px; border-radius:50% 0 50% 0;
    background: var(--gold);
    opacity:.35;
    animation: fall linear infinite;
    filter: blur(.3px);
  }
  @keyframes fall{
    0%   { transform: translate3d(0,-10vh,0) rotate(0deg); opacity:0; }
    10%  { opacity: .5; }
    100% { transform: translate3d(40px, 110vh, 0) rotate(720deg); opacity:0; }
  }

  /* ---------- Hero / portada ---------- */
  .hero{
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr;
    overflow: hidden;
  }
  .hero-photo{
    position: absolute; inset:0; z-index: 0;
    background-size: cover; background-position: center;
    filter: saturate(.85) brightness(.9);
  }
  .hero-photo::after{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(10,29,56,0) 0%, rgba(10,29,56,.35) 55%, rgba(10,29,56,.85) 100%),
      linear-gradient(180deg, rgba(26,58,108,.35) 0%, rgba(15,40,71,.55) 45%, rgba(10,29,56,.85) 100%);
  }
  .hero-inner{
    position: relative; z-index: 1;
    display:flex; flex-direction:column;
    align-items:center; justify-content: space-between;
    padding: 40px 24px 48px;
    min-height: 100vh;
    min-height: 100svh;
    color: var(--paper);
    text-align: center;
  }
  .hero-top{
    display:flex; flex-direction:column; align-items:center; gap: 14px;
  }
  .monogram{
    width: 58px; height: 58px;
    border:1px solid rgba(250,247,242,.55);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--display);
    font-size: 18px;
    letter-spacing: .05em;
  }
  .monogram span{ display:inline-block; transform: translateY(-1px); }
  .hero-center{
    display:flex; flex-direction:column; align-items:center; gap: 18px;
    padding: 24px 0;
  }
  .hero-invite-label{
    color: rgba(250,247,242,.75);
    font-family: var(--sans);
    font-size: 11px; letter-spacing: .48em; text-transform: uppercase;
  }
  .hero-names{
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(56px, 14vw, 168px);
    line-height: .95;
    letter-spacing: -0.01em;
    color: var(--paper);
    margin: 8px 0;
  }
  .hero-names .amp{
    font-family: var(--serif); font-style: italic;
    font-weight: 300;
    color: var(--gold-soft);
    display:block;
    font-size: clamp(36px, 8vw, 96px);
    margin: -4px 0;
  }
  .hero-sub{
    font-style: italic;
    font-size: clamp(16px, 2.2vw, 20px);
    color: rgba(250,247,242,.9);
    max-width: 32ch;
    font-weight: 300;
  }
  .hero-date{
    display:flex; align-items:center; gap: 18px;
    font-family: var(--sans);
    font-size: 11px; letter-spacing: .4em; text-transform: uppercase;
    color: rgba(250,247,242,.85);
  }
  .hero-date .line{
    width: 40px; height:1px; background: rgba(250,247,242,.5);
  }
  .hero-bottom{
    display:flex; flex-direction:column; align-items:center; gap: 10px;
    color: rgba(250,247,242,.85);
  }
  .hero-bottom .place{
    font-family: var(--display);
    font-size: clamp(20px, 3.2vw, 28px);
    letter-spacing: .06em;
  }
  .scroll-hint{
    font-family: var(--sans);
    font-size: 10px; letter-spacing: .4em; text-transform: uppercase;
    color: rgba(250,247,242,.7);
    display:flex; flex-direction:column; align-items:center; gap: 6px;
  }
  .scroll-hint .ln{ width:1px; height: 28px; background: rgba(250,247,242,.5); animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ transform: scaleY(.4); opacity:.5; transform-origin: top;}
    50%{ transform: scaleY(1); opacity:1; transform-origin: top;}
  }

  /* ---------- Secciones ---------- */
  section{ position: relative; }
  .wrap{ max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .section-title-kicker{
    font-family: var(--sans);
    font-size: 10.5px; letter-spacing: .48em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
  }
  .section-title{
    font-family: var(--display);
    font-size: clamp(40px, 6.5vw, 78px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: .005em;
    color: var(--ink);
  }
  .section-title .it{ font-family: var(--serif); font-style: italic; font-weight: 300; color: var(--ink-soft); }

  .lead{
    font-size: clamp(17px, 1.8vw, 21px);
    font-weight: 300;
    line-height: 1.65;
    color: var(--ink-soft);
    max-width: 52ch;
    text-wrap: pretty;
  }
  .lead em{ color: var(--ink); font-style: italic; }

  /* Verse section */
  .verse{
    padding: 96px 0 72px;
    text-align:center;
    background: var(--paper);
    position: relative;
  }
  .verse .q{
    font-family: var(--display);
    font-size: clamp(26px, 4.8vw, 56px);
    line-height: 1.25;
    max-width: 22ch;
    margin: 28px auto 18px;
    color: var(--ink);
  }
  .verse .q em{ font-family: var(--serif); font-style: italic; font-weight: 300; color: var(--gold); }
  .verse .attr{
    font-family: var(--sans);
    font-size: 11px; letter-spacing: .38em; text-transform: uppercase;
    color: var(--muted); margin-top: 18px;
  }

  /* Countdown */
  .countdown-section{
    padding: 40px 0 80px;
    text-align: center;
  }
  .countdown{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    max-width: 720px;
    margin: 32px auto 0;
    gap: 0;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }
  .countdown > div{
    padding: 26px 8px;
    border-right: 1px solid var(--hairline);
  }
  .countdown > div:last-child{ border-right: none; }
  .countdown .n{
    font-family: var(--display);
    font-size: clamp(36px, 6vw, 56px);
    color: var(--ink);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown .u{
    font-family: var(--sans);
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
    color: var(--muted); margin-top: 10px;
  }

  /* Story */
  .intro{
    padding: 96px 0;
    display:grid; gap: 56px;
    grid-template-columns: 1fr;
    align-items:center;
  }
  @media (min-width: 880px){
    .intro{ grid-template-columns: 1.1fr 1fr; gap: 80px; }
  }
  .intro .photo-frame{
    position: relative;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: var(--paper-warm);
  }
  .intro .photo-frame::after{
    content:''; position:absolute; inset: 14px; border:1px solid rgba(250,247,242,.55); pointer-events:none;
  }
  .intro .photo-frame img{
    width:100%; height:100%; object-fit:cover;
  }

  /* Gallery */
  .gallery{
    padding: 80px 0 96px;
  }
  .gallery-head{ text-align:center; margin-bottom: 48px; }
  .gallery-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 90px;
    gap: 10px;
  }
  .gallery-grid .g{
    overflow: hidden;
    background: var(--paper-warm);
    position: relative;
  }
  .gallery-grid .g img{ width:100%; height:100%; object-fit:cover; transition: transform .9s ease; }
  .gallery-grid .g:hover img{ transform: scale(1.04); }
  .g1 { grid-column: span 3; grid-row: span 4; }
  .g2 { grid-column: span 3; grid-row: span 2; }
  .g3 { grid-column: span 2; grid-row: span 2; }
  .g4 { grid-column: span 1; grid-row: span 2; }
  .g5 { grid-column: span 3; grid-row: span 3; }
  .g6 { grid-column: span 3; grid-row: span 3; }
  @media (max-width: 720px){
    .gallery-grid{ grid-template-columns: repeat(4, 1fr); grid-auto-rows: 70px; }
    .g1{ grid-column: span 4; grid-row: span 4;}
    .g2{ grid-column: span 2; grid-row: span 2;}
    .g3{ grid-column: span 2; grid-row: span 2;}
    .g4{ grid-column: span 2; grid-row: span 2;}
    .g5{ grid-column: span 2; grid-row: span 3;}
    .g6{ grid-column: span 2; grid-row: span 3;}
  }

  /* Event cards */
  .events{
    padding: 80px 0;
    background: var(--paper-warm);
    position: relative;
  }
  .events-head{ text-align:center; margin-bottom: 56px;}
  .event-grid{
    display:grid; gap: 32px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 780px){
    .event-grid{ grid-template-columns: 1fr 1px 1fr; gap: 56px; align-items:stretch; }
    .event-grid .divider-v{ background: var(--hairline); width:1px; }
  }
  .event-card{
    text-align: center;
    display:flex; flex-direction:column; gap: 8px; align-items:center;
  }
  .event-card .ico{
    width: 52px; height: 52px; margin-bottom: 14px;
    display:flex; align-items:center; justify-content:center;
    color: var(--gold);
  }
  .event-card h3{
    font-family: var(--display);
    font-size: clamp(32px, 4.2vw, 46px);
    font-weight: 400;
    margin: 0 0 6px; color: var(--ink);
  }
  .event-card .where{
    font-style: italic; font-size: 18px; color: var(--ink-soft); max-width: 26ch; line-height: 1.5;
  }
  .event-card .addr{
    font-family: var(--sans);
    font-size: 12px; color: var(--muted);
    letter-spacing: .05em;
    max-width: 32ch;
  }
  .event-card .time{
    font-family: var(--display);
    font-size: 28px;
    color: var(--gold);
    margin: 10px 0 6px;
    letter-spacing: .04em;
  }
  .event-card .maps{
    display:flex; gap: 10px; margin-top: 16px;
  }
  .btn{
    font-family: var(--sans);
    font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase;
    padding: 12px 18px;
    border: 1px solid var(--ink);
    color: var(--ink);
    background: transparent;
    cursor: pointer;
    text-decoration: none;
    transition: background .25s ease, color .25s ease;
  }
  .btn:hover{ background: var(--ink); color: var(--paper); }
  .btn.gold{ border-color: var(--gold); color: var(--gold); }
  .btn.gold:hover{ background: var(--gold); color: var(--paper); }
  .btn.solid{ background: var(--ink); color: var(--paper); }
  .btn.solid:hover{ background: var(--gold); border-color: var(--gold); color: var(--paper); }

  /* Timeline */
  .timeline-section{ padding: 96px 0; }
  .timeline{
    max-width: 680px; margin: 48px auto 0;
    position: relative;
  }
  .timeline::before{
    content:''; position: absolute; left: 50%; top: 0; bottom:0;
    width:1px; background: var(--hairline); transform: translateX(-.5px);
  }
  @media (max-width: 680px){
    .timeline::before{ left: 20px; }
  }
  .t-item{
    position: relative;
    display:grid; grid-template-columns: 1fr 40px 1fr;
    align-items:center;
    padding: 20px 0;
  }
  .t-item .dot{
    width: 10px; height:10px; border-radius:50%;
    background: var(--paper); border: 1px solid var(--gold);
    justify-self:center;
    position: relative;
    z-index: 1;
  }
  .t-item .dot::after{
    content:''; position:absolute; inset: 2px; border-radius:50%; background: var(--gold);
  }
  .t-item .time{
    font-family: var(--display); font-size: 26px; color: var(--gold);
  }
  .t-item .what{
    font-style: italic; font-size: 19px; color: var(--ink-soft);
  }
  .t-item.left .time{ text-align: right; padding-right: 18px; }
  .t-item.left .what{ text-align: left; padding-left: 18px; }
  .t-item.right .time{ text-align: right; padding-right: 18px; order: 1;}
  .t-item.right .what{ text-align: left; padding-left: 18px; order: 3;}
  .t-item.right .dot{ order: 2; }
  .t-item.left  .time{ order: 1;}
  .t-item.left  .dot{ order: 2;}
  .t-item.left  .what{ order: 3;}
  @media (max-width: 680px){
    .t-item{ grid-template-columns: 40px 1fr; }
    .t-item .time{ text-align:left !important; padding: 0 0 4px 0 !important; order: 2 !important; grid-column: 2;}
    .t-item .what{ text-align:left !important; padding: 0 !important; order: 3 !important; grid-column: 2;}
    .t-item .dot{ order: 1 !important; grid-column: 1; grid-row: span 2; align-self:center;}
    .t-item > *{ }
  }

  /* Parents & gratitude */
  .parents{
    padding: 96px 0;
    text-align: center;
    background: var(--ink);
    color: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .parents::before{
    content:''; position:absolute; inset: 24px; border: 1px solid rgba(201,169,97,.25); pointer-events:none;
  }
  .parents .small{ color: var(--gold-soft); }
  .parents h2{
    font-family: var(--display);
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 400;
    margin: 14px 0 22px;
  }
  .parents p.lead{ color: rgba(250,247,242,.8); margin: 0 auto; }
  .parents .names{
    margin-top: 48px;
    display:grid; grid-template-columns: 1fr; gap: 28px;
    max-width: 680px; margin-left:auto; margin-right:auto;
  }
  @media(min-width: 680px){
    .parents .names{ grid-template-columns: 1fr 1fr; gap: 40px;}
  }
  .parents .p-block .role{
    font-family: var(--sans); font-size: 10.5px;
    letter-spacing: .45em; text-transform:uppercase;
    color: var(--gold-soft);
  }
  .parents .p-block .pn{
    font-family: var(--display);
    font-size: 22px;
    margin-top: 10px;
    line-height: 1.4;
    color: var(--paper);
  }

  /* Dress code */
  .dress{
    padding: 96px 0;
    text-align: center;
  }
  .dress .head{ margin-bottom: 44px;}
  .dress .words{
    font-family: var(--display);
    font-size: clamp(32px, 4.5vw, 52px);
    color: var(--ink);
    margin: 28px 0 8px;
    letter-spacing: .04em;
  }
  .dress .sub{ font-style: italic; color: var(--ink-soft); font-size: 18px; margin-bottom: 40px;}
  .palette{
    display:flex; justify-content:center; gap: 18px; flex-wrap: wrap;
    margin-top: 30px;
  }
  .swatch{ text-align:center; }
  .swatch .sw{
    width: 66px; height:66px; border-radius:50%;
    border: 1px solid var(--hairline);
    box-shadow: 0 1px 3px rgba(26,47,74,.08), inset 0 0 0 6px rgba(255,255,255,.35);
  }
  .swatch .sn{
    font-family: var(--sans); font-size: 10px; letter-spacing: .32em; text-transform:uppercase;
    color: var(--muted); margin-top: 10px;
  }

  /* Gift registry */
  .registry{
    padding: 96px 0;
    background: var(--paper-warm);
    text-align: center;
  }
  .registry .cards{
    display: grid; gap: 20px; margin-top: 44px;
    grid-template-columns: 1fr;
  }
  @media(min-width: 720px){ .registry .cards{ grid-template-columns: 1fr 1fr 1fr; }}
  .gcard{
    background: var(--paper);
    padding: 36px 24px 32px;
    border: 1px solid var(--hairline);
    text-align: center;
    position: relative;
  }
  .gcard .lb{
    font-family: var(--sans); font-size: 10.5px;
    letter-spacing: .4em; text-transform: uppercase; color: var(--gold);
  }
  .gcard h4{
    font-family: var(--display);
    font-size: 28px; font-weight: 400; margin: 14px 0 4px;
  }
  .gcard .dt{
    font-style: italic; color: var(--ink-soft); font-size: 15px; margin-bottom: 18px;
  }
  .gcard .acct{
    font-family: var(--sans); font-size: 12px; color: var(--ink);
    letter-spacing: .1em;
    padding: 10px 0;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }

  /* RSVP */
  .rsvp{
    padding: 112px 0 96px;
    text-align: center;
    background: var(--ink);
    color: var(--paper);
    position: relative;
  }
  .rsvp .lead{ color: rgba(250,247,242,.8); margin: 24px auto 40px; }
  .rsvp h2{
    font-family: var(--display);
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 400; margin: 0;
  }
  .rsvp h2 em{ font-family: var(--serif); font-style: italic; color: var(--gold-soft); }
  .rsvp-form{
    max-width: 520px; margin: 16px auto 0;
    display:grid; gap: 14px;
  }
  .rsvp-form input, .rsvp-form select, .rsvp-form textarea{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(250,247,242,.3);
    padding: 14px 4px;
    color: var(--paper);
    font-family: var(--serif); font-size: 16px;
    outline: none;
  }
  .rsvp-form input::placeholder, .rsvp-form textarea::placeholder{
    color: rgba(250,247,242,.45);
    font-style: italic;
  }
  .rsvp-form input:focus, .rsvp-form select:focus, .rsvp-form textarea:focus{
    border-bottom-color: var(--gold);
  }
  .rsvp-form .row{ display:grid; gap: 14px;}
  @media(min-width: 600px){ .rsvp-form .row{ grid-template-columns: 1fr 1fr; }}
  .rsvp-form .submit{
    margin-top: 20px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 16px 28px;
    letter-spacing: .4em; text-transform: uppercase;
    font-family: var(--sans); font-size: 11px;
    cursor: pointer;
    transition: background .3s, color .3s;
  }
  .rsvp-form .submit:hover{ background: var(--gold); color: var(--ink); }

  /* Footer */
  footer{
    padding: 56px 0 72px;
    text-align: center;
    background: var(--paper);
  }
  footer .mono{ margin: 0 auto 14px; }
  footer .sig{
    font-family: var(--display);
    font-size: 22px;
    color: var(--ink);
  }
  footer .sm{
    font-family: var(--sans); font-size: 11px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--muted);
    margin-top: 14px;
  }

  /* Fade-in on scroll */
  .reveal{
    opacity: 0; transform: translateY(28px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .reveal.in{ opacity: 1; transform: none; }

  /* ---- Dedicatoria ---- */
  .dedication{
    padding: 96px 0 80px;
    text-align: center;
    position: relative;
  }
  .dedication .wrap{ max-width: 720px; }
  .dedi-name{
    font-family: var(--display);
    font-size: clamp(34px, 5.2vw, 58px);
    line-height: 1.1;
    color: var(--ink);
    padding: 10px 0 20px;
  }
  .dedi-name::before, .dedi-name::after{
    content:''; display:block; width: 60px; height:1px;
    background: var(--gold-soft);
    margin: 18px auto;
  }
  .dedi-pass{
    display:flex; align-items:stretch; justify-content:center;
    gap: 0; margin: 6px auto 28px; max-width: 420px;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 22px 0;
  }
  .pass-side{ flex:1; padding: 0 14px; }
  .pass-divider{ width:1px; background: var(--hairline); }
  .pass-k{
    font-family: var(--sans);
    font-size: 10px; letter-spacing: .4em; text-transform:uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .pass-v{
    font-family: var(--display);
    font-size: 34px; color: var(--gold); line-height: 1;
  }
  .pass-v.it{ font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--ink-soft); }
  .dedi-note{
    font-style: italic;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    max-width: 44ch;
    margin: 10px auto 0;
  }
  .dedi-note-strong{
    display: inline-block;
    font-style: italic;
    font-weight: 600;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.5;
    letter-spacing: .01em;
  }

  /* RSVP secondary note */
  .rsvp-note{
    margin-top: 16px !important;
    font-size: 14px !important;
    opacity: .8;
    font-style: italic;
    max-width: 56ch;
  }

  /* ---- RSVP quick ---- */
  .rsvp-quick{ max-width: 560px; margin: 12px auto 0; display:block; text-align:center; }
  .rsvp-q{
    font-family: var(--sans);
    font-size: 11px; letter-spacing: .4em; text-transform: uppercase;
    color: var(--gold-soft);
    margin: 24px 0 14px;
  }
  .rsvp-choices{
    display:flex; gap: 12px; justify-content:center; flex-wrap:wrap;
  }
  .rsvp-choices .choice{
    flex: 1 1 200px;
    max-width: 240px;
    background: transparent;
    border: 1px solid rgba(250,247,242,.35);
    color: var(--paper);
    padding: 16px 20px;
    font-family: var(--serif);
    font-size: 17px;
    font-style: italic;
    cursor: pointer;
    transition: all .3s ease;
  }
  .rsvp-choices .choice:hover{ border-color: var(--gold); color: var(--gold-soft); }
  .rsvp-choices .choice.on{
    background: var(--gold); border-color: var(--gold); color: var(--ink);
    font-style: normal;
  }
  .rsvp-count{ margin-top: 8px; }
  .count-note{
    font-style: italic; font-size: 15px; color: rgba(250,247,242,.7);
    margin-bottom: 18px;
  }
  .count-note em{ color: var(--gold-soft); font-style: normal; }
  .count-picker{
    display:flex; gap: 10px; justify-content:center; flex-wrap:wrap;
    margin-bottom: 8px;
  }
  .count-picker .num{
    width: 52px; height: 52px; border-radius: 50%;
    background: transparent;
    border: 1px solid rgba(250,247,242,.35);
    color: var(--paper);
    font-family: var(--display);
    font-size: 22px;
    cursor: pointer;
    transition: all .25s ease;
  }
  .count-picker .num:hover{ border-color: var(--gold); }
  .count-picker .num.on{
    background: var(--gold); border-color: var(--gold); color: var(--ink);
  }
  .rsvp-form .submit:disabled{ opacity:.35; cursor: not-allowed; }

  /* --- Ornamentos orquídeas & velas --- */
  .verse-ornament{
    display:flex; justify-content:center;
    margin-bottom: 24px;
  }
  .dedi-candles{
    display:flex; justify-content:center; align-items:flex-end; gap: 16px;
    margin-bottom: 20px;
  }
  .parents-orchid{
    position: absolute; width: 70px; height: 70px; pointer-events:none;
  }
  .parents-orchid.tl{ top: 40px; left: 40px; transform: rotate(-25deg); }
  .parents-orchid.br{ bottom: 40px; right: 40px; transform: rotate(155deg); }
  .rsvp-orchid{
    display:flex; justify-content:center; margin: 16px 0 4px;
    color: var(--gold-soft);
  }
  .hero-orchid-l, .hero-orchid-r{
    position:absolute; top: 50%; transform: translateY(-50%);
    width: 80px; z-index: 1; opacity: .5; color: var(--gold-soft);
    pointer-events:none;
  }
  .hero-orchid-l{ left: 12px; transform: translateY(-50%) rotate(-15deg); }
  .hero-orchid-r{ right: 12px; transform: translateY(-50%) rotate(195deg); }
  @media (max-width: 680px){
    .hero-orchid-l, .hero-orchid-r, .parents-orchid{ display:none; }
  }

  /* --- Velas trio --- */
  .dedi-candles{
    display:flex; justify-content:center;
    margin: -10px 0 28px;
  }
  .verse-candles{
    display:flex; justify-content:center;
    margin-bottom: 28px;
  }

  /* Tweaks panel */
  .tweaks{
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    width: 290px; max-width: calc(100vw - 32px);
    background: var(--paper);
    border: 1px solid var(--hairline);
    box-shadow: 0 10px 40px rgba(26,47,74,.18);
    padding: 18px 18px 16px;
    font-family: var(--sans);
    color: var(--ink);
    display: none;
  }
  .tweaks.open{ display:block; }
  .tweaks h5{
    margin: 0 0 12px;
    font-family: var(--display); font-size: 20px; font-weight: 400;
    border-bottom: 1px solid var(--hairline); padding-bottom: 10px;
  }
  .tweaks .row{
    display:flex; align-items:center; justify-content:space-between;
    margin: 10px 0; gap: 10px;
    font-size: 11px; letter-spacing: .08em;
  }
  .tweaks .row > span { color: var(--muted); text-transform: uppercase; letter-spacing: .2em; font-size: 10px; }
  .tweaks select, .tweaks input[type="text"]{
    font-family: var(--sans); font-size: 12px;
    padding: 6px 8px; border: 1px solid var(--hairline); background: var(--paper);
    color: var(--ink); max-width: 60%;
  }
  .tweaks .chips{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .tweaks .chip{
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--hairline);
    cursor:pointer; position: relative;
  }
  .tweaks .chip.on{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .tweaks .close{
    position: absolute; top: 8px; right: 10px;
    background: transparent; border:none; color: var(--muted); cursor:pointer;
    font-size: 16px; line-height: 1;
  }

  /* photo placeholder styling */
  .ph{
    width:100%; height:100%;
    background-size: cover; background-position: center;
    position: relative;
  }
  .ph .ph-lbl{
    position:absolute; left:10px; bottom:10px;
    font-family: var(--sans); font-size: 9px; letter-spacing: .28em; text-transform:uppercase;
    color: rgba(250,247,242,.85);
    mix-blend-mode: difference;
  }

  /* Layout: centered variant */
  body.layout-centered .intro{ grid-template-columns: 1fr; text-align: center; }
  body.layout-centered .intro .photo-frame{ max-width: 420px; margin: 0 auto; }
  body.layout-centered .intro > div:first-child{ order: 2; }
  body.layout-centered .intro > div:last-child{ order: 1; display:flex; flex-direction: column; align-items:center;}
  body.layout-centered .lead{ margin-left:auto; margin-right:auto; }
</style>
